<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf5ed"><title>מה יכול להיוולד תוך כדי? · להיות אני</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="mast"><a class="brand" href="https://immamagshima.co.il/" target="_blank" rel="noopener"><img src="assets/ima-magshima-mark-orange.png" alt="אמא מגשימה"><span>קרן בן עמי<span class="brand-sub">אמא מגשימה</span></span></a><span class="wordmark">להיות אני</span><button id="pause" class="quiet" hidden>לעצור רגע</button></header>
<main id="main" tabindex="-1"></main>
<footer class="bottom"><span id="stepLabel">מפגש קטן עם משהו שמחכה לך</span><div id="progress" class="progress" aria-label="התקדמות"></div><span class="rights">כל הזכויות שמורות © 2026, קרן בן עמי, אמא מגשימה</span></footer>
<dialog id="pauseDialog" aria-labelledby="pauseTitle"><h2 id="pauseTitle">אפשר להניח את זה רגע.</h2><p>אין לאן למהר. מה שכתבת נשאר בכרטיסייה הזאת, ולא נשלח לאף אחד.</p><div class="dialog-actions"><button id="resume" class="primary">לחזור למפגש</button><button id="resetAsk" class="quiet">להתחיל מחדש</button></div></dialog>
<dialog id="resetDialog" aria-labelledby="resetTitle"><h2 id="resetTitle">להתחיל דף חדש?</h2><p>המילים והבחירות של המפגש הזה יימחקו מהמכשיר הזה.</p><div class="dialog-actions"><button id="resetConfirm" class="primary">כן, דף חדש</button><button id="resetCancel" class="quiet">להישאר עם מה שיש</button></div></dialog>
<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body></html>
